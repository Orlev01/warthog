- { fact: amendment-2026-11-23.life-admin-profile, value: "typed life-admin categories filled in by the person's own agent from email; agent records are suggestions the person confirms; plate is an everyday field of a vehicle record", provenance: user-stated, raw: "2026-11-23: people have a lot of things in their life that they need to stay on top of in terms of admin ... when my registration expires, what rego my motorcycle is, what my number plate is, who my insurer is ... Someone's car, insurance, and registration need to be grouped as one type of category ... subscriptions ... my health insurance ... My superannuation ... Off the back of connecting a tool like Google, Gmail, or Microsoft Outlook ... we can populate within Wharthog a bunch of this stuff. Any agent that links into Wharthog automatically gets access to these different categories", decision: "option B (the person's own agent reads the mail through Warthog; Warthog supplies the catalogue, skill and checks) because constraints no-ai-model-calls, zero-cost-third-parties and azure-australia-east each rule out Warthog running a model; see docs/adr/life-admin-profile.md" }
- { fact: amendment-2026-11-23.life-areas, value: "life admin filed by what it's about, built-in categories hidden until used, agent-suggested categories in a generic renderable shape, bookings and cases with live/finished lifecycles, generic anchors, and a per-item journal with steward hand-over", provenance: user-stated, raw: "2026-11-23: people will have different 'what it's about' ... have a predefined list ... and then a way to instruct the agent to suggest additional lists that can be rendered in warthog ... include booking as lots of people have bookings for hotels, restaurants, flights, medical appointments ... an audit log of them with live and expired so any agent can see the list ... any agent can come in and pick up on things that are still live or active ... one, maximum two lines of decision reasoning", decision: "founder chose: ship stacked with the typed profile; suggested categories show at once marked suggested; steward automatic with take-over; no parcels in v1; plus a cross-category Bookings view with finished history, generic anchors for custom categories, and a journal on every item that finished items keep (docs/adr/life-admin-journal.md)" }
