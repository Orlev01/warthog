version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
    ignore:
      # The application and delivery images run Node 22. Newer declarations can
      # allow APIs that do not exist in that runtime; upgrade them together.
      - dependency-name: '@types/node'
        versions: ['>=23']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
