name: Azure application release (manual maintenance)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect settings, first creation, or image-only update
        type: choice
        options: [inspect, create, update]
        required: true
      approval_reference:
        description: Reviewed image, funding, credentials, migration compatibility and maintenance window
        type: string
        required: true
      image_digest:
        description: Exact ACR repository@sha256 digest published from this main commit
        type: string
      expected_config_sha256:
        description: Update only - reviewed current configuration hash from inspect
        type: string
      activate_deletion_journal:
        description: Separately approved first activation after immutable storage and writer grant are verified
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: warthog-azure-production
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require configured delivery before requesting a private runner
        env:
          AZURE_DELIVERY_ENABLED: ${{ vars.AZURE_DELIVERY_ENABLED }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: PYTHONPATH=scripts/ci python3 -c 'from common import gate; gate()'
  release:
    needs: gate
    # Dedicated, ephemeral, trusted-main-only runner in the private bootstrap subnet.
    # Provisioning it is a separate approval; public PRs never execute on it.
    runs-on: [self-hosted, linux, x64, warthog-production, 'warthog-run-${{ github.run_id }}']
    timeout-minutes: 45
    environment: azure-production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_DELIVERY_ENABLED: ${{ vars.AZURE_DELIVERY_ENABLED }}
      APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
      OPERATION: ${{ inputs.operation }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      EXPECTED_CONFIG_SHA256: ${{ inputs.expected_config_sha256 }}
      ACTIVATE_DELETION_JOURNAL: ${{ inputs.activate_deletion_journal }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      APP_NAME: ${{ vars.APP_NAME }}
      POSTGRES_FQDN: ${{ vars.POSTGRES_FQDN }}
      WORKLOAD_PARAMETERS_JSON: ${{ secrets.WORKLOAD_PARAMETERS_JSON }}
      OWNERSHIP_DATABASE_URL: ${{ secrets.OWNERSHIP_DATABASE_URL }}
      AZURE_CORE_OUTPUT: none
      AZURE_EXTENSION_USE_DYNAMIC_INSTALL: "no"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exchange production-environment OIDC identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: 72277873-e056-4612-9b1c-7ad58e02fcf3
          subscription-id: e854f594-274f-4051-841b-78df7655d73c
      - name: Enforce stop, zero replicas, free lock, start and health checks
        run: python3 scripts/ci/deploy_app.py
