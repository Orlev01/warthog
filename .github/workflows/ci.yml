name: Warthog release checks

# Documentation is not part of the build context, the image or any test, so changes to it alone
# run nothing. An image build still checks the exact tree it publishes (see `plan`).
on:
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
  workflow_call:
    inputs:
      node_base_image:
        description: The reviewed node:22-bookworm-slim@sha256 digest an image build checks with
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: warthog-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests and manual runs check in full. A push to main or an image build skips the
  # checks below only when this exact tree already passed them on the same pinned Node base
  # (scripts/ci/reuse_checks.py); the `passed` job at the end is that evidence.
  plan:
    name: Reuse an identical passing result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      reuse: ${{ steps.decide.outputs.reuse }}
      tree: ${{ steps.decide.outputs.tree }}
      base: ${{ steps.decide.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_BASE_INPUT: ${{ inputs.node_base_image }}
        run: python3 scripts/ci/reuse_checks.py

  delivery-safety:
    name: Delivery approval and singleton guards
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Verify launch cost calculation and profile agreement
        run: |
          python3 -m unittest discover -s infra/costs -p 'test_*.py' -v
          python3 infra/costs/estimate.py --check-profile

  infrastructure-schema:
    name: Terraform syntax and provider schemas
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the reviewed Terraform CLI
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - name: Check formatting
        run: terraform -chdir=infra fmt -check -recursive
      - name: Check the separate workload template offline
        run: python3 infra/workload/check_template.py
      - name: Initialize providers without a backend or Azure login
        run: terraform -chdir=infra init -backend=false -input=false
      - name: Validate provider schemas without an Azure plan or apply
        run: terraform -chdir=infra validate
      - name: Validate isolated state and identity bootstrap without Azure access
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/bootstrap validate
      - name: Validate delivery access and ephemeral runner modules
        run: |
          terraform -chdir=infra/access init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/access validate
          terraform -chdir=infra/runner init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/runner validate
          bash -n scripts/delivery/prepare-runner.sh

  linux-postgres:
    name: Node 22 Linux and PostgreSQL 16 (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # One pinned base for every shard: the image build's, or the default tag resolved once.
      NODE_BASE_IMAGE: ${{ needs.plan.outputs.base }}
      WARTHOG_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the disposable test configuration
        run: docker compose -f scripts/local-postgres-check.compose.yaml config --quiet
      - name: Build clean Linux verification image
        run: docker compose -f scripts/local-postgres-check.compose.yaml build --pull --build-arg "NODE_BASE_IMAGE=$NODE_BASE_IMAGE" verification
      - name: Check types, full suite, runtime and real PostgreSQL
        run: docker compose -f scripts/local-postgres-check.compose.yaml up --no-build --abort-on-container-exit --exit-code-from verification
      - name: Remove disposable database and test containers
        if: always()
        run: docker compose -f scripts/local-postgres-check.compose.yaml down --volumes --remove-orphans
      - name: Build the separate non-root runtime image
        run: docker build --target runtime --platform linux/amd64 --build-arg "NODE_BASE_IMAGE=$NODE_BASE_IMAGE" --label "org.opencontainers.image.revision=$GITHUB_SHA" --iidfile /tmp/warthog-runtime-image-id -t warthog-ci-runtime .
      - name: Record local image evidence
        run: |
          docker image inspect warthog-ci-runtime --format 'Image={{.Id}} Platform={{.Os}}/{{.Architecture}} User={{.Config.User}} Revision={{index .Config.Labels "org.opencontainers.image.revision"}}'
          docker run --rm --network none --entrypoint sh warthog-ci-runtime -c 'test "$(id -u)" = 1000 && test -z "$(find /usr/bin /usr/sbin -type f -perm /6000)"'
          container_id=$(docker create warthog-ci-runtime)
          trap 'docker rm "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/app/release-manifest.json" /tmp/warthog-release-manifest.json
          cat /tmp/warthog-release-manifest.json
          # This image is neither pushed nor started with production credentials.

  # Runs only when every check above passed. Its name records the tree and base they passed for,
  # which is what a later push or image build looks for before skipping them.
  passed:
    name: Full checks passed for tree ${{ needs.plan.outputs.tree }} on ${{ needs.plan.outputs.base }}
    needs: [plan, delivery-safety, infrastructure-schema, linux-postgres]
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "Every check passed for this tree on this Node base."
